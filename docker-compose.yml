services:
  app1:
    build:
      context: .
      args:
        DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Use Neon as the primary Postgres database. Prefer the pooled Neon URL here.
      - DATABASE_URL=${DOCKER_DATABASE_URL:-${DATABASE_URL}}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  app2:
    build:
      context: .
      args:
        DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Use Neon as the primary Postgres database. Prefer the pooled Neon URL here.
      - DATABASE_URL=${DOCKER_DATABASE_URL:-${DATABASE_URL}}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  load-balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta
      # n8n will store workflows, credentials, etc. in SQLite by default
      # inside the mounted volume — no extra DB needed.
      - N8N_SECURE_COOKIE=false          # allow http://localhost access
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    # On Windows/Mac Docker Desktop, host.docker.internal resolves to
    # the host machine so n8n can reach Next.js at localhost:3000.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
